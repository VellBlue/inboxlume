name: Package smoke test (manual, no upload)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Local package build · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check -e ".[desktop,packaging]"
      - name: Prepare sanitized icons
        run: python scripts/prepare_release_assets.py
      - name: Build unsigned local package
        run: python scripts/package_desktop.py --build
      - name: Run the packaged worker on synthetic data only
        run: python scripts/smoke_packaged_worker.py
      - name: Verify publication is still blocked
        run: python scripts/check_release_gate.py --require-blocked

# Questo workflow non firma, non carica artifact, non crea release e non pubblica
# GitHub Pages. Serve soltanto a verificare manualmente il packaging sui tre runner.
